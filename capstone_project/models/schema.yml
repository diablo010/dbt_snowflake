version: 2

models:
  - name: STG_CUSTOMERS
    description: "Staging table for customers"
    columns:
      - name: customer_id
        description: "The primary key for stg_customers table"
        data_tests:
          - unique
          - not_null

  - name: STG_SALES
    description: "Staging table for sales"
    columns:
      - name: sale_id
        description: "The primary key for stg_sales table"
        data_tests:
          - unique
          - not_null

  - name: STG_PRODUCTS
    description: "Staging table for products"
    columns:
      - name: product_id
        description: "The primary key for stg_products table"
        data_tests:
          - unique
          - not_null

  - name: DIM_CUSTOMER
    description: "Customer dimension table"
    columns:
      - name: CUSTOMER_ID
        tests:
          - unique
          - not_null

  - name: DIM_PRODUCT
    description: "Product dimension table"
    columns:
      - name: PRODUCT_ID
        tests:
          - unique
          - not_null

  - name: FACT_SALES
    description: "Fact table containing sales transactions"
    columns:
      - name: SALE_ID
        tests:
          - unique
          - not_null

      - name: CUSTOMER_ID
        tests:
          - relationships:
              arguments:
                to: ref('DIM_CUSTOMER')
                field: CUSTOMER_ID

      - name: PRODUCT_ID
        tests:
          - relationships:
              arguments:
                to: ref('DIM_PRODUCT')
                field: PRODUCT_ID

